<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        :root { 
            --bg-body: #0f172a; 
            --bg-card: #1e293b; 
            --text-main: #f8fafc; 
            --text-muted: #94a3b8; 
            --border-light: #334155;
            --accent-red: #e50914; 
            --accent-blue: #3b82f6; 
        }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; padding: 0; 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            line-height: 1.6;
        }
        
        /* --- الخلفية السينمائية العلوية --- */
        .hero-backdrop {
            width: 100%; height: 60vh; 
            background-size: cover; background-position: center; 
            position: relative;
        }
        .hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, var(--bg-body) 0%, rgba(15, 23, 42, 0.4) 100%);
        }
        
        /* --- زر العودة --- */
        .back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 15px; border-radius: 20px; text-decoration: none;
            display: flex; align-items: center; gap: 5px; font-weight: bold; backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        .back-btn:hover { background: var(--accent-red); transform: scale(1.05); }

        /* --- محتوى الصفحة --- */
        .content-wrapper {
            max-width: 1000px; margin: -15vh auto 0; padding: 0 20px 50px; 
            position: relative; z-index: 5; display: flex; gap: 30px; flex-wrap: wrap;
        }
        
        .poster-section { flex-shrink: 0; width: 280px; }
        .poster-img { width: 100%; border-radius: 15px; box-shadow: 0 15px 30px rgba(0,0,0,0.6); border: 2px solid var(--border-light); }
        
        .info-section { flex: 1; min-width: 300px; }
        .show-title { font-size: 2.8rem; font-weight: 900; margin: 0 0 10px; line-height: 1.1; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        
        .meta-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .meta-pill { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.05); }
        
        .ratings-box { display: flex; gap: 15px; margin-bottom: 20px; }
        .rate-card { background: var(--bg-card); padding: 10px 20px; border-radius: 12px; border: 1px solid var(--border-light); display: flex; flex-direction: column; align-items: center; min-width: 90px; }
        .rate-card span:first-child { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        .rate-card span:last-child { font-size: 1.4rem; font-weight: 900; margin-top: 5px; }

        .overview { font-size: 1.1rem; color: #cbd5e1; margin-bottom: 30px; }
        
        .actions-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 30px; }
        .action-btn { display: flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; text-decoration: none; border: none; transition: 0.2s; }
        .btn-trailer { background: var(--accent-red); color: white; }
        .btn-trailer:hover { background: #cc0812; transform: translateY(-2px); }
        .btn-fav { background: var(--bg-card); color: white; border: 1px solid var(--border-light); }
        .btn-fav:hover { border-color: var(--accent-blue); transform: translateY(-2px); }
        .btn-stremio { background: #8A5A9E; color: white; }
        .btn-stremio:hover { background: #6a3e7a; transform: translateY(-2px); }

        /* --- المواسم --- */
        .section-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 15px; border-top: 1px solid var(--border-light); padding-top: 20px; }
        .seasons-scroll { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; }
        .season-card { min-width: 140px; background: var(--bg-card); border-radius: 10px; overflow: hidden; border: 1px solid var(--border-light); }
        .season-img { width: 100%; height: 210px; object-fit: cover; }
        .season-bot { padding: 10px; text-align: center; }
        .season-name { margin: 0; font-size: 0.9rem; font-weight: bold; }
        .season-ep { font-size: 0.8rem; color: var(--text-muted); }
        .season-check { background: none; border: none; color: #64748b; cursor: pointer; display: block; margin: 5px auto 0; transition: 0.2s; }
        .season-check.watched { color: #8b5cf6; }

        /* --- توافق الجوال --- */
        @media (max-width: 768px) {
            .content-wrapper { flex-direction: column; align-items: center; margin-top: -5vh; text-align: center; }
            .poster-section { width: 180px; }
            .meta-row, .ratings-box, .actions-row { justify-content: center; }
            .action-btn { width: 100%; justify-content: center; }
            .show-title { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div id="hero" class="hero-backdrop">
        <div class="hero-overlay"></div>
        <a href="index.html" class="back-btn"><span class="material-symbols-outlined">arrow_back</span> Back</a>
    </div>

    <div class="content-wrapper">
        <div class="poster-section">
            <img id="poster" src="" alt="Poster" class="poster-img">
        </div>
        
        <div class="info-section">
            <h1 id="title" class="show-title">Loading...</h1>
            
            <div id="meta" class="meta-row">
                </div>
            
            <div class="ratings-box">
                <div class="rate-card"><span>TMDB</span><span id="tmdb-rate">⏳</span></div>
                <div class="rate-card"><span>IMDb</span><span id="imdb-rate">⏳</span></div>
            </div>
            
            <p id="overview" class="overview">Fetching details...</p>
            
            <div class="actions-row">
                <a id="btn-trailer" class="action-btn btn-trailer" target="_blank" style="display:none;"><span class="material-symbols-outlined">play_circle</span> Trailer</a>
                <button id="btn-fav" class="action-btn btn-fav"><span class="material-symbols-outlined">favorite</span> Add to Favorites</button>
                <a id="btn-stremio" class="action-btn btn-stremio" style="display:none;"><span class="material-symbols-outlined">play_arrow</span> Stremio</a>
            </div>

            <div id="seasons-container" style="display:none;">
                <div class="section-title">Seasons Tracker</div>
                <div id="seasons-list" class="seasons-scroll"></div>
            </div>
        </div>
    </div>

    <script>
        const TMDB_API_KEY = 'e7be99b2666a862f16f0a6b5441c150b'; 
        const OMDB_API_KEY = '75583472';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const IMG_URL_LG = 'https://image.tmdb.org/t/p/original';

        // 1. قراءة الـ ID من الرابط (مثال: details.html?id=123)
        const urlParams = new URLSearchParams(window.location.search);
        const showId = urlParams.get('id');

        if (!showId) {
            window.location.href = 'index.html'; // إذا لم يكن هناك ID، نعود للرئيسية
        } else {
            loadShowDetails(showId);
        }

        async function loadShowDetails(id) {
            try {
                const res = await fetch(`${BASE_URL}/tv/${id}?api_key=${TMDB_API_KEY}&language=en-US`);
                const show = await res.json();

                // تعبئة البيانات الأساسية
                document.title = show.name + " - Tracker";
                document.getElementById('title').innerText = show.name;
                document.getElementById('overview').innerText = show.overview || "No overview available.";
                document.getElementById('poster').src = show.poster_path ? IMG_URL + show.poster_path : 'https://via.placeholder.com/500x750?text=No+Image';
                
                if (show.backdrop_path) {
                    document.getElementById('hero').style.backgroundImage = `url('${IMG_URL_LG + show.backdrop_path}')`;
                }

                // الكبسولات (Meta)
                const metaDiv = document.getElementById('meta');
                let metaHtml = `<span class="meta-pill">📅 ${show.first_air_date ? show.first_air_date.split('-')[0] : 'N/A'}</span>`;
                metaHtml += `<span class="meta-pill">📺 ${show.status}</span>`;
                if (show.genres) {
                    show.genres.forEach(g => metaHtml += `<span class="meta-pill">${g.name}</span>`);
                }
                metaDiv.innerHTML = metaHtml;

                // التقييمات
                document.getElementById('tmdb-rate').innerText = `⭐ ${show.vote_average.toFixed(1)}`;
                fetchExternalRatings(id);

                // التريلر
                fetch(`${BASE_URL}/tv/${id}/videos?api_key=${TMDB_API_KEY}`)
                .then(r => r.json()).then(vData => {
                    const trailer = vData.results?.find(v => v.type === 'Trailer' && v.site === 'YouTube');
                    if (trailer) {
                        const btn = document.getElementById('btn-trailer');
                        btn.href = `https://www.youtube.com/watch?v=${trailer.key}`;
                        btn.style.display = 'flex';
                    }
                });

                // زر المفضلة
                setupFavoriteBtn(show);

                // المواسم
                setupSeasons(show);

            } catch (err) {
                document.getElementById('title').innerText = "Error loading show!";
            }
        }

        async function fetchExternalRatings(id) {
            try {
                const extRes = await fetch(`${BASE_URL}/tv/${id}/external_ids?api_key=${TMDB_API_KEY}`);
                const extData = await extRes.json();
                if (extData.imdb_id) {
                    const omdbRes = await fetch(`https://www.omdbapi.com/?i=${extData.imdb_id}&apikey=${OMDB_API_KEY}`);
                    const omdbData = await omdbRes.json();
                    if (omdbData.imdbRating && omdbData.imdbRating !== "N/A") {
                        document.getElementById('imdb-rate').innerText = `🎬 ${omdbData.imdbRating}`;
                    } else {
                        document.getElementById('imdb-rate').innerText = "N/A";
                    }

                    // تفعيل زر ستريميو
                    const stremioBtn = document.getElementById('btn-stremio');
                    stremioBtn.href = `stremio:///detail/series/${extData.imdb_id}/${extData.imdb_id}`;
                    stremioBtn.style.display = 'flex';
                }
            } catch (e) {}
        }

        function setupFavoriteBtn(show) {
            let favorites = JSON.parse(localStorage.getItem('my_favorite_shows')) || [];
            const favBtn = document.getElementById('btn-fav');
            let isFav = favorites.some(f => f.id === show.id);
            
            favBtn.innerHTML = isFav ? '<span class="material-symbols-outlined">heart_broken</span> Remove Favorite' : '<span class="material-symbols-outlined">favorite</span> Add to Favorites';
            
            favBtn.onclick = () => {
                favorites = JSON.parse(localStorage.getItem('my_favorite_shows')) || [];
                const index = favorites.findIndex(f => f.id === show.id);
                if (index !== -1) {
                    favorites.splice(index, 1);
                    favBtn.innerHTML = '<span class="material-symbols-outlined">favorite</span> Add to Favorites';
                } else {
                    favorites.push(show);
                    favBtn.innerHTML = '<span class="material-symbols-outlined">heart_broken</span> Remove Favorite';
                }
                localStorage.setItem('my_favorite_shows', JSON.stringify(favorites));
            };
        }

        function setupSeasons(show) {
            const validSeasons = show.seasons ? show.seasons.filter(s => s.episode_count > 0) : [];
            if (validSeasons.length === 0) return;

            document.getElementById('seasons-container').style.display = 'block';
            const sList = document.getElementById('seasons-list');
            
            let list = JSON.parse(localStorage.getItem('my_watched_shows')) || [];
            let existingShow = list.find(w => w.id === show.id);
            let watchedSeasons = existingShow && existingShow.watched_seasons ? existingShow.watched_seasons : [];

            validSeasons.forEach(season => {
                const isWatched = watchedSeasons.includes(season.season_number);
                const img = season.poster_path ? IMG_URL + season.poster_path : (show.poster_path ? IMG_URL + show.poster_path : '');
                
                const card = document.createElement('div');
                card.className = 'season-card';
                card.innerHTML = `
                    <img src="${img}" class="season-img">
                    <div class="season-bot">
                        <p class="season-name">${season.name}</p>
                        <p class="season-ep">${season.episode_count} Episodes</p>
                        <button class="season-check ${isWatched ? 'watched' : ''}" data-season="${season.season_number}">
                            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' ${isWatched ? '1' : '0'}; font-size:28px;">check_circle</span>
                        </button>
                    </div>
                `;
                sList.appendChild(card);

                // تفعيل التتبع
                const btn = card.querySelector('.season-check');
                btn.onclick = () => {
                    const sNum = season.season_number;
                    const isNowWatched = btn.classList.contains('watched');
                    
                    if (isNowWatched) {
                        watchedSeasons = watchedSeasons.filter(s => s !== sNum);
                        btn.classList.remove('watched');
                        btn.querySelector('span').style.fontVariationSettings = "'FILL' 0";
                    } else {
                        watchedSeasons.push(sNum);
                        btn.classList.add('watched');
                        btn.querySelector('span').style.fontVariationSettings = "'FILL' 1";
                    }
                    
                    let currList = JSON.parse(localStorage.getItem('my_watched_shows')) || [];
                    let idx = currList.findIndex(w => w.id === show.id);
                    show.watched_seasons = watchedSeasons;
                    
                    if (watchedSeasons.length > 0) {
                        if (idx > -1) currList[idx] = show; else currList.push(show);
                    } else {
                        currList = currList.filter(w => w.id !== show.id);
                    }
                    localStorage.setItem('my_watched_shows', JSON.stringify(currList));
                };
            });
        }
    </script>
</body>
</html>
