<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>">
    <title>New Shows Tracker</title>
    <style>
        :root {
            --bg-color: #141414;
            --text-color: #ffffff;
            --card-bg: #2f2f2f;
            --imdb-color: #f5c518;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        
        /* ----- Header & Background Design ----- */
        header {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), rgba(20, 20, 20, 1)), 
                        url('https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            border-bottom: 3px solid #e50914;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        header h1, header p {
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
        }
        header h1 {
            margin-top: 0;
            font-size: 2.5rem;
        }
        
        /* ----- Search & Sort Controls ----- */
        .controls-wrapper {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .search-container {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .search-container input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 25px;
            border: 2px solid var(--card-bg);
            background-color: #111;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .search-container input:focus {
            border-color: #e50914;
        }
        .search-container button {
            background-color: #e50914;
            border-radius: 25px;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .sort-container {
            text-align: center;
        }
        .sort-container select {
            padding: 8px 15px;
            border-radius: 5px;
            background-color: var(--card-bg);
            color: white;
            border: 1px solid #555;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .sort-container select:focus {
            border-color: #e50914;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            flex-wrap: wrap;
        }
        button {
            background-color: var(--card-bg);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        button:hover, button.active {
            background-color: #e50914; 
        }
        
        /* زر المفضلة في القائمة الرئيسية */
        .fav-filter-btn {
            background-color: #FFD700 !important;
            color: #000 !important;
        }
        .fav-filter-btn:hover, .fav-filter-btn.active {
            background-color: #e5c100 !important;
        }

        .shows-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .show-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
            position: relative;
            cursor: pointer;
        }
        .show-card:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .show-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background-color: #444;
        }
        .show-info {
            padding: 15px;
            text-align: center;
        }
        .show-title {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5rem;
            color: #aaa;
            width: 100%;
        }
        
        #load-more-btn {
            background-color: #333;
            border: 2px solid #555;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            margin-bottom: 40px;
        }
        #load-more-btn:hover {
            background-color: #e50914;
            border-color: #e50914;
        }

        /* ----- Modal Design ----- */
        .modal {
            display: none; 
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85); 
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            max-width: 800px;
            width: 100%;
            position: relative;
            animation: fadeIn 0.3s ease-in-out;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            max-height: 90vh;
            overflow-y: auto;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px; 
            font-size: 35px;
            cursor: pointer;
            color: #aaa;
            transition: color 0.3s;
        }
        .close-btn:hover {
            color: #fff;
        }
        .modal-poster {
            width: 250px;
            border-radius: 10px;
            object-fit: cover;
        }
        .modal-details {
            flex: 1;
            min-width: 300px;
        }
        .modal-details h2 { margin-top: 0; color: #fff; }
        .modal-overview { line-height: 1.6; color: #ddd; font-size: 1.05rem; }
        
        .ratings-box {
            background-color: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .rating-item {
            display: flex;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .rating-label {
            width: 140px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .trailer-btn, .fav-btn {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            border: none;
        }
        
        .trailer-btn {
            background-color: #e50914;
        }
        .trailer-btn:hover {
            background-color: #f40612;
            transform: scale(1.05);
        }

        .fav-btn {
            background-color: #333;
        }
        .fav-btn:hover {
            background-color: #555;
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>
        <h1>📺 New Shows Tracker</h1>
        <p>Your quick guide to the latest and most popular TV shows</p>
        
        <div class="controls-wrapper">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search for any TV show..." onkeypress="handleKeyPress(event)">
                <button onclick="performSearch()">Search</button>
            </div>

            <div class="sort-container">
                <label for="sort-select" style="color: #aaa; font-weight: bold; margin-right: 10px;">Sort By:</label>
                <select id="sort-select" onchange="applySort()">
                    <option value="popularity.desc">Most Popular</option>
                    <option value="first_air_date.desc">Newest Release</option>
                    <option value="vote_average.desc">Highest Rated</option>
                </select>
            </div>
        </div>
    </header>

    <div class="filters" id="filters">
        <button class="active" onclick="fetchShows('213', this)">Netflix</button>
        <button onclick="fetchShows('1024', this)">Amazon Prime</button>
        <button onclick="fetchShows('49', this)">HBO</button>
        <button onclick="fetchShows('2552', this)">Apple TV+</button>
        <button onclick="fetchShows('453', this)">Hulu</button>
        <button onclick="fetchShows('2739', this)">Disney+</button>
        <button class="fav-filter-btn" onclick="showFavorites(this)">⭐ My Favorites</button>
    </div>

    <div class="shows-grid" id="shows-grid">
        </div>

    <div style="text-align: center;">
        <button id="load-more-btn" style="display: none;" onclick="loadMore()">Load More ⬇️</button>
    </div>

    <div id="show-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modal-img" src="" alt="Poster" class="modal-poster">
            <div class="modal-details">
                <h2 id="modal-title">Show Title</h2>
                <p id="modal-date" style="color: #aaa; font-size: 0.9rem; margin-top: 0;"></p>
                
                <div class="ratings-box">
                    <div class="rating-item" style="color: #01b4e4;">
                        <span class="rating-label">TMDB Rating:</span> 
                        <span>⭐ <span id="modal-rating"></span> / 10</span>
                    </div>
                    <div class="rating-item" style="color: var(--imdb-color);">
                        <span class="rating-label">IMDb Rating:</span> 
                        <span>🎬 <span id="modal-imdb-rating">Loading...</span></span>
                    </div>
                </div>

                <h3>Overview:</h3>
                <p id="modal-overview" class="modal-overview"></p>
                
                <div class="action-buttons">
                    <a id="trailer-btn" class="trailer-btn" href="#" target="_blank" style="display: none;">▶ Watch Trailer</a>
                    <button id="favorite-btn" class="fav-btn">❤️ Add to Favorites</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TMDB_API_KEY = 'e7be99b2666a862f16f0a6b5441c150b'; 
        const OMDB_API_KEY = '75583472';

        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        
        const grid = document.getElementById('shows-grid');
        const modal = document.getElementById('show-modal');
        const loadMoreBtn = document.getElementById('load-more-btn');

        let currentPage = 1;
        let currentMode = 'network';
        let currentNetwork = '213';
        let currentSearchQuery = '';

        function applySort() {
            if (currentMode === 'network') {
                fetchShows(currentNetwork, document.querySelector('.filters button.active'), 1);
            } else if (currentMode === 'search') {
                performSearch(1);
            } else if (currentMode === 'favorites') {
                showFavorites(document.querySelector('.fav-filter-btn'));
            }
        }

        async function fetchShows(networkId, btnElement, page = 1) {
            currentMode = 'network';
            currentNetwork = networkId;
            currentPage = page;

            if (page === 1) {
                document.getElementById('search-input').value = ''; 
                grid.innerHTML = '<div class="loading">Loading shows... ⏳</div>';
                loadMoreBtn.style.display = 'none';
            }
            
            if (btnElement) {
                const buttons = document.querySelectorAll('.filters button');
                buttons.forEach(btn => btn.classList.remove('active'));
                btnElement.classList.add('active');
            }

            const sortValue = document.getElementById('sort-select').value;
            let extraParams = '';
            if (sortValue === 'vote_average.desc') extraParams = '&vote_count.gte=200';
            else if (sortValue === 'first_air_date.desc') extraParams = '&vote_count.gte=5';

            try {
                const response = await fetch(`${BASE_URL}/discover/tv?api_key=${TMDB_API_KEY}&language=en-US&sort_by=${sortValue}${extraParams}&with_networks=${networkId}&page=${page}`);
                if (!response.ok) throw new Error('Connection error with TMDB.');

                const data = await response.json();
                
                if (page === 1) grid.innerHTML = '';
                
                displayShows(data.results);

                if (data.page < data.total_pages) {
                    loadMoreBtn.style.display = 'inline-block';
                } else {
                    loadMoreBtn.style.display = 'none';
                }

            } catch (error) {
                if (page === 1) grid.innerHTML = `<div class="loading" style="color: red;">${error.message}</div>`;
            }
        }

        async function performSearch(page = 1) {
            currentMode = 'search';
            currentPage = page;

            if (page === 1) {
                currentSearchQuery = document.getElementById('search-input').value.trim();
                grid.innerHTML = '<div class="loading">Searching... 🔍</div>';
                loadMoreBtn.style.display = 'none';
                
                const buttons = document.querySelectorAll('.filters button');
                buttons.forEach(btn => btn.classList.remove('active'));
            }

            if (!currentSearchQuery) return;

            try {
                const response = await fetch(`${BASE_URL}/search/tv?api_key=${TMDB_API_KEY}&language=en-US&query=${encodeURIComponent(currentSearchQuery)}&page=${page}`);
                if (!response.ok) throw new Error('Search failed.');

                const data = await response.json();
                
                if (page === 1 && data.results.length === 0) {
                    grid.innerHTML = '<div class="loading">No shows found. Try another name!</div>';
                    return;
                }

                if (page === 1) grid.innerHTML = '';

                let sortedResults = data.results;
                const sortValue = document.getElementById('sort-select').value;
                
                if (sortValue === 'first_air_date.desc') {
                    sortedResults.sort((a, b) => new Date(b.first_air_date || 0) - new Date(a.first_air_date || 0));
                } else if (sortValue === 'vote_average.desc') {
                    sortedResults.sort((a, b) => b.vote_average - a.vote_average);
                } else {
                    sortedResults.sort((a, b) => b.popularity - a.popularity);
                }

                displayShows(sortedResults);

                if (data.page < data.total_pages) {
                    loadMoreBtn.style.display = 'inline-block';
                } else {
                    loadMoreBtn.style.display = 'none';
                }

            } catch (error) {
                if (page === 1) grid.innerHTML = `<div class="loading" style="color: red;">${error.message}</div>`;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                performSearch(1);
            }
        }

        // دالة عرض المفضلة
        function showFavorites(btnElement) {
            currentMode = 'favorites';
            document.getElementById('search-input').value = '';
            
            if (btnElement) {
                const buttons = document.querySelectorAll('.filters button');
                buttons.forEach(btn => btn.classList.remove('active'));
                btnElement.classList.add('active');
            }

            grid.innerHTML = '';
            loadMoreBtn.style.display = 'none'; // لا حاجة لزر تحميل المزيد في المفضلة

            let favorites = JSON.parse(localStorage.getItem('my_favorite_shows')) || [];

            if (favorites.length === 0) {
                grid.innerHTML = '<div class="loading" style="grid-column: 1 / -1;">No favorites yet. Save some shows first! ⭐</div>';
                return;
            }

            // ترتيب المفضلة حسب اختيار المستخدم
            const sortValue = document.getElementById('sort-select').value;
            if (sortValue === 'first_air_date.desc') {
                favorites.sort((a, b) => new Date(b.first_air_date || 0) - new Date(a.first_air_date || 0));
            } else if (sortValue === 'vote_average.desc') {
                favorites.sort((a, b) => b.vote_average - a.vote_average);
            } else {
                favorites.sort((a, b) => b.popularity - a.popularity);
            }

            displayShows(favorites);
        }

        function loadMore() {
            if (currentMode === 'network') {
                fetchShows(currentNetwork, null, currentPage + 1);
            } else if (currentMode === 'search') {
                performSearch(currentPage + 1);
            }
        }

        function displayShows(showsToDisplay) {
            showsToDisplay.forEach(show => {
                const card = document.createElement('div');
                card.className = 'show-card';
                card.onclick = () => openModal(show);
                
                const posterPath = show.poster_path ? IMG_URL + show.poster_path : 'https://via.placeholder.com/500x750?text=No+Image';
                const releaseYear = show.first_air_date ? show.first_air_date.substring(0,4) : 'N/A';

                card.innerHTML = `
                    <img src="${posterPath}" alt="${show.name}" class="show-image">
                    <div class="show-info">
                        <h3 class="show-title">${show.name}</h3>
                        <p style="color: #aaa; font-size: 0.85rem; margin: 0; display: flex; justify-content: space-between;">
                            <span>⭐ ${show.vote_average.toFixed(1)}</span>
                            <span>📅 ${releaseYear}</span>
                        </p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function fetchIMDbRating(tmdbId) {
            try {
                const extRes = await fetch(`${BASE_URL}/tv/${tmdbId}/external_ids?api_key=${TMDB_API_KEY}`);
                const extData = await extRes.json();
                const imdbId = extData.imdb_id;

                if (!imdbId) return "No IMDb ID available";

                const omdbRes = await fetch(`https://www.omdbapi.com/?i=${imdbId}&apikey=${OMDB_API_KEY}`);
                const omdbData = await omdbRes.json();

                if (omdbData.Response === "True" && omdbData.imdbRating !== "N/A") {
                    return `${omdbData.imdbRating} / 10 (${omdbData.imdbVotes} votes)`;
                }
                return "Not available";
            } catch (error) {
                return "Error loading IMDb data";
            }
        }

        async function openModal(show) {
            document.getElementById('modal-title').innerText = show.name;
            document.getElementById('modal-rating').innerText = show.vote_average.toFixed(1);
            document.getElementById('modal-date').innerText = 'Release Date: ' + (show.first_air_date || 'Not available');
            document.getElementById('modal-overview').innerText = show.overview ? show.overview : 'Sorry, no overview available for this show.';
            
            const posterPath = show.poster_path ? IMG_URL + show.poster_path : 'https://via.placeholder.com/500x750?text=No+Image';
            document.getElementById('modal-img').src = posterPath;
            
            const imdbRatingSpan = document.getElementById('modal-imdb-rating');
            imdbRatingSpan.innerText = 'Loading... ⏳';
            imdbRatingSpan.style.color = '#aaa';
            
            const trailerBtn = document.getElementById('trailer-btn');
            trailerBtn.style.display = 'none'; 

            // معالجة زر المفضلة
            let favorites = JSON.parse(localStorage.getItem('my_favorite_shows')) || [];
            let favBtn = document.getElementById('favorite-btn');
            
            // إزالة المستمعات القديمة حتى لا تتكرر العمليات
            let newFavBtn = favBtn.cloneNode(true);
            favBtn.parentNode.replaceChild(newFavBtn, favBtn);
            
            const isFav = favorites.some(f => f.id === show.id);
            newFavBtn.innerText = isFav ? '❌ Remove from Favorites' : '❤️ Add to Favorites';
            
            newFavBtn.onclick = (e) => {
                e.preventDefault();
                favorites = JSON.parse(localStorage.getItem('my_favorite_shows')) || [];
                
                if (favorites.some(f => f.id === show.id)) {
                    // إزالة من المفضلة
                    favorites = favorites.filter(f => f.id !== show.id);
                    newFavBtn.innerText = '❤️ Add to Favorites';
                } else {
                    // إضافة للمفضلة
                    favorites.push(show);
                    newFavBtn.innerText = '❌ Remove from Favorites';
                }
                
                localStorage.setItem('my_favorite_shows', JSON.stringify(favorites));
                
                // تحديث الشاشة فوراً إذا كنا في تبويب المفضلة
                if (currentMode === 'favorites') {
                    showFavorites(document.querySelector('.fav-filter-btn'));
                }
            };

            modal.style.display = 'flex';

            fetchIMDbRating(show.id).then(imdbRating => {
                imdbRatingSpan.innerText = imdbRating;
                imdbRatingSpan.style.color = 'white';
            });
            
            fetch(`${BASE_URL}/tv/${show.id}/videos?api_key=${TMDB_API_KEY}`) 
                .then(res => res.json())
                .then(data => {
                    if (data.results && data.results.length > 0) {
                        let trailer = data.results.find(vid => vid.site === 'YouTube' && vid.type === 'Trailer');
                        if (!trailer) trailer = data.results.find(vid => vid.site === 'YouTube' && vid.type === 'Teaser');
                        if (!trailer) trailer = data.results.find(vid => vid.site === 'YouTube');

                        if (trailer) {
                            trailerBtn.href = `https://www.youtube.com/watch?v=${trailer.key}`;
                            trailerBtn.style.display = 'inline-block';
                        }
                    }
                })
                .catch(err => console.log("Trailer fetch error:", err));
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }

        // Initial fetch
        fetchShows('213', document.querySelector('.filters button'), 1);
    </script>
</body>
</html>
