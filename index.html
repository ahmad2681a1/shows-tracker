<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Shows Tracker">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>">
    <title>New Shows Tracker</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <button id="theme-toggle" class="theme-toggle">🌙 Dark Mode</button>
        <h1>📺 New Shows Tracker</h1>
        <p>Your minimalist guide to the latest and most popular TV shows</p>
        
        <div class="controls-wrapper">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search for any TV show..." onkeypress="handleKeyPress(event)">
                <button onclick="performSearch()">Search</button>
            </div>
            
            <div class="dropdowns-row">
                <div class="sort-container">
                    <label for="sort-select">Sort:</label>
                    <select id="sort-select" onchange="applyFilters()">
                        <option value="popularity.desc">Most Popular</option>
                        <option value="first_air_date.desc">Newest Release</option>
                        <option value="vote_average.desc">Highest Rated</option>
                    </select>
                </div>
                <div class="genre-container">
                    <label for="genre-select">Genre:</label>
                    <select id="genre-select" onchange="applyFilters()">
                        <option value="">All Genres</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <div class="filters" id="filters">
        <button class="network-btn active" onclick="fetchShows('213', this, 1)" title="Netflix">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix" height="16">
        </button>
        <button class="network-btn" onclick="fetchShows('1024', this, 1)" title="Amazon Prime">
            <img src="https://upload.wikimedia.org/wikipedia/commons/1/11/Amazon_Prime_Video_logo.svg" alt="Amazon Prime" height="16">
        </button>
        <button class="network-btn" onclick="fetchShows('49', this, 1)" title="HBO">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/de/HBO_logo.svg" alt="HBO" height="16" class="theme-icon">
        </button>
        <button class="network-btn" onclick="fetchShows('2552', this, 1)" title="Apple TV+">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/28/Apple_TV_Plus_Logo.svg" alt="Apple TV+" height="16" class="theme-icon">
        </button>
        <button class="network-btn" onclick="fetchShows('453', this, 1)" title="Hulu">
            <span style="color: #1ce783; font-weight: 900; font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif; font-size: 18px; letter-spacing: -0.5px; line-height: 1;">hulu</span>
        </button>
        <button class="network-btn" onclick="fetchShows('2739', this, 1)" title="Disney+">
            <span style="font-weight: 800; font-family: 'Avenir Next', 'Arial Black', sans-serif; font-size: 16px; letter-spacing: 0.5px; line-height: 1;">Disney<span style="font-size: 18px; vertical-align: top; line-height: 0.8;">+</span></span>
        </button>
        <button class="network-btn" onclick="showUpcoming(this, 1)">📅 Upcoming</button>
        <button class="fav-filter-btn" onclick="showFavorites(this)">⭐ My Favorites</button>
        <button class="watched-filter-btn" onclick="showWatched(this)">✔️ Watched Shows</button>
    </div>

    <div class="shows-grid" id="shows-grid"></div>

    <div id="show-modal" class="modal">
        <div class="modal-content" id="modal-content-box">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modal-img" src="" alt="Poster" class="modal-poster">
            
            <div class="modal-details">
                <h2 id="modal-title">Show Title</h2>
                
                <div class="modal-meta-info">
                    <span id="modal-date" class="meta-badge">📅 Loading...</span>
                    <span id="modal-status" class="meta-badge">Status: Loading...</span>
                    <span id="modal-seasons" class="meta-badge">Seasons: Loading...</span>
                    <span id="modal-country" class="meta-badge">🌍 Origin: Loading...</span>
                </div>
                
                <div id="modal-genres" class="modal-genres"></div>
                
                <div class="ratings-box">
                    <div class="rating-item" style="color: #01b4e4;">
                        <span class="rating-label">TMDB</span> 
                        <span class="rating-value" style="display: flex; align-items: center; gap: 6px;">
                            <img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_square_1-5bdc75aaebeb75dc7ae79426ddd9be3b2be1e342510f8202baf6bffa71d7f5c4.svg" alt="TMDB" style="height: 14px;">
                            <span id="modal-tmdb-rating">...</span>
                        </span>
                        <span id="modal-tmdb-votes" class="rating-votes"></span>
                    </div>
                    
                    <div class="rating-item" style="color: #d97706;">
                        <span class="rating-label">IMDb</span> 
                        <span class="rating-value" style="display: flex; align-items: center; gap: 6px;">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/6/69/IMDB_Logo_2016.svg" alt="IMDb" style="height: 16px; border-radius: 2px;">
                            <span id="modal-imdb-rating">...</span>
                        </span>
                        <span id="modal-imdb-votes" class="rating-votes"></span>
                    </div>
                    
                    <div class="rating-item" style="color: #ed1c24;">
                        <span class="rating-label">Trakt</span> 
                        <span class="rating-value" style="display: flex; align-items: center; gap: 6px;">
                            <img src="https://cdn.simpleicons.org/trakt/ed1c24" alt="Trakt" style="height: 16px;">
                            <span id="modal-trakt-rating">...</span>
                        </span>
                        <span id="modal-trakt-votes" class="rating-votes"></span>
                    </div>
                </div>

                <h3>Overview:</h3>
                <p id="modal-overview" class="modal-overview"></p>
                
                <div class="action-buttons">
                    <a id="trailer-btn" class="trailer-btn" href="#" target="_blank" style="display: none;">▶ Watch Trailer</a>
                    <button id="favorite-btn" class="fav-btn">❤️ Add to Favorites</button>
                </div>

                <div id="seasons-tracker-container" style="display: none; width: 100%;">
                    <div class="seasons-section-title">Seasons</div>
                    <div id="seasons-list" class="seasons-container"></div>
                </div>

                <div class="share-row">
                    <span class="share-label">Share on:</span>
                    <a id="share-wa" class="share-btn share-wa" target="_blank" href="#" title="WhatsApp">
                        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                        </a>
                        <a id="share-tw" class="share-btn share-tw" target="_blank" href="#" title="X">
                            <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                        </a>
                        <a id="stremio-btn" class="stremio-btn" href="#" title="Play on Stremio" style="display: none;">
                            <span class="material-symbols-outlined">play_circle</span>
                            Open in Stremio
                        </a>
                    </div>
                </div>

                <div class="recommendations-section" id="rec-section" style="display: none;">
                    <h3>Similar Shows</h3>
                    <div class="rec-container" id="rec-container"></div>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
    </html>
