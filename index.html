<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>">
    <title>New Shows Tracker</title>
    <style>
        :root {
            --bg-color: #141414;
            --text-color: #ffffff;
            --card-bg: #2f2f2f;
            --imdb-color: #f5c518;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        
        /* ----- Header & Background Design ----- */
        header {
            text-align: center;
            padding: 4rem 2rem;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), rgba(20, 20, 20, 1)), 
                        url('https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            border-bottom: 3px solid #e50914;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        header h1, header p { text-shadow: 2px 2px 5px rgba(0,0,0,0.8); }
        header h1 { margin-top: 0; font-size: 2.5rem; }
        
        /* ----- Search & Controls ----- */
        .controls-wrapper {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .search-container {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .search-container input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 25px;
            border: 2px solid var(--card-bg);
            background-color: #111;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }
        .search-container input:focus { border-color: #e50914; }
        .search-container button {
            background-color: #e50914;
            border-radius: 25px;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
        }
        
        /* --- Dropdowns Row --- */
        .dropdowns-row { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .sort-container, .genre-container { display: flex; align-items: center; background-color: var(--card-bg); padding: 5px 15px; border-radius: 25px; border: 1px solid #555; }
        .sort-container select, .genre-container select { background-color: transparent; color: white; border: none; font-size: 1rem; outline: none; cursor: pointer; padding: 5px; }
        select option { background-color: #222222; color: #ffffff; }

        /* --- Network Filters --- */
        .filters { display: flex; justify-content: center; gap: 10px; padding: 20px; flex-wrap: wrap; }
        button.network-btn { background-color: var(--card-bg); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        button.network-btn:hover, button.network-btn.active { background-color: #e50914; }
        .fav-filter-btn { background-color: #FFD700 !important; color: #000 !important; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .fav-filter-btn:hover, .fav-filter-btn.active { background-color: #e5c100 !important; }
        .watched-filter-btn { background-color: #4CAF50 !important; color: white !important; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .watched-filter-btn:hover, .watched-filter-btn.active { background-color: #45a049 !important; }

        /* --- Grid & Cards --- */
        .shows-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .show-card { background-color: var(--card-bg); border-radius: 10px; overflow: hidden; transition: transform 0.3s; position: relative; cursor: pointer; display: flex; flex-direction: column; }
        .show-card:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 2; }
        .show-image { width: 100%; height: 300px; object-fit: cover; background-color: #444; }
        .show-info { padding: 15px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .show-title { margin: 0 0 10px 0; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* تنسيق كبسولات التقييمات في الكروت (الجديد) */
        .card-meta-footer { display: flex; flex-wrap: nowrap; justify-content: center; gap: 5px; }
        .rating-pill { display: flex; align-items: center; gap: 4px; background-color: #1a1a1a; padding: 4px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; color: #eee; border: 1px solid #333; white-space: nowrap; }
        .icon-tmdb { height: 10px; }
        .icon-imdb { height: 12px; border-radius: 2px; }
        
        /* أكواد تصميم أزرار المشاركة الدائرية بالأيقونات الأصلية */
        .share-row { display: flex; align-items: center; gap: 12px; margin-top: 25px; border-top: 1px solid #444; padding-top: 15px; flex-wrap: wrap; }
        .share-label { color: #aaa; font-weight: bold; font-size: 1.1rem; margin-right: 5px; }
        .share-btn { 
            text-decoration: none; 
            width: 42px; 
            height: 42px; 
            border-radius: 50%; /* لجعل الزر دائرياً بالكامل */
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: 0.3s; 
        }
        .share-btn svg { width: 22px; height: 22px; fill: white; } /* تنسيق الأيقونات (SVG) */
        .share-wa { background-color: #25D366; } /* لون واتساب */
        .share-tw { background-color: #000000; border: 1px solid #444; } /* لون إكس */
        .share-btn:hover { transform: scale(1.15); filter: brightness(1.1); }

        /* شارة "تم المشاهدة" المصغرة والأنيقة */
        .watched-badge { position: absolute; top: 8px; right: 8px; background-color: rgba(76, 175, 80, 0.95); color: white; padding: 4px; border-radius: 4px; font-size: 0.75rem; line-height: 1; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        /* --- Skeleton Loaders --- */
        .skeleton { background: linear-gradient(90deg, #333 25%, #444 50%, #333 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .skeleton-card { background-color: var(--card-bg); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
        .skeleton-img { width: 100%; height: 300px; }
        .skeleton-info { padding: 15px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .skeleton-text { height: 18px; border-radius: 4px; width: 80%; }
        .skeleton-text-small { height: 14px; border-radius: 4px; width: 100%; }
        .loading-message { text-align: center; color: #aaa; padding: 20px; font-size: 1.2rem; grid-column: 1 / -1; }

        /* ----- Modal Design ----- */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .modal-content { background-color: var(--card-bg); padding: 30px; border-radius: 15px; max-width: 900px; width: 100%; position: relative; animation: fadeIn 0.3s ease-in-out; display: flex; gap: 25px; flex-wrap: wrap; max-height: 90vh; overflow-y: auto; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 35px; cursor: pointer; color: #aaa; transition: color 0.3s; }
        .close-btn:hover { color: #fff; }
        .modal-poster { width: 280px; border-radius: 10px; object-fit: cover; align-self: flex-start; }
        .modal-details { flex: 1; min-width: 300px; }
        .modal-details h2 { margin-top: 0; margin-bottom: 5px; color: #fff; font-size: 2rem; }
        .modal-meta-info { color: #aaa; font-size: 0.95rem; margin-bottom: 15px; display: flex; gap: 15px; flex-wrap: wrap; }
        .meta-badge { background-color: #444; padding: 4px 10px; border-radius: 5px; color: #fff; font-weight: bold; }
        
        .ratings-box { background-color: #1a1a1a; padding: 15px; border-radius: 8px; margin: 15px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        .rating-item { display: flex; flex-direction: column; align-items: center; text-align: center; background-color: #222; padding: 15px; border-radius: 8px; }
        .rating-label { font-size: 0.9rem; color: #aaa; margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase;}
        .rating-value { font-size: 1.4rem; font-weight: bold; }
        .rating-votes { font-size: 0.9rem; color: #888; margin-top: 5px; font-weight: normal; }

        .modal-overview { line-height: 1.6; color: #ddd; font-size: 1.05rem; }
        
        /* Action Buttons */
        .action-buttons { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; align-items: center; }
        .trailer-btn, .fav-btn, .watched-btn { 
            background-color: #2196F3; 
            color: white; 
            padding: 0 10px; 
            height: 40px; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 1rem; 
            cursor: pointer; 
            transition: 0.3s; 
            border: none; 
            outline: none;
        }
        }
        .trailer-btn { background-color: #e50914; }
        .trailer-btn:hover { background-color: #f40612; transform: scale(1.05); }
        .fav-btn { background-color: #333; }
        .fav-btn:hover { background-color: #555; transform: scale(1.05); }
        .watched-select:hover { background-color: #0b7dda; }
        .watched-select option { background-color: #222; color: #fff; }

        .recommendations-section { width: 100%; margin-top: 30px; border-top: 1px solid #444; padding-top: 20px; }
        .recommendations-section h3 { margin-top: 0; color: #fff; }
        .rec-container { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: thin; scrollbar-color: #e50914 #222; }
        .rec-container::-webkit-scrollbar { height: 8px; }
        .rec-container::-webkit-scrollbar-track { background: #222; border-radius: 10px; }
        .rec-container::-webkit-scrollbar-thumb { background: #e50914; border-radius: 10px; }
        .rec-card { min-width: 140px; width: 140px; cursor: pointer; transition: 0.3s; }
        .rec-card:hover { transform: scale(1.05); }
        .rec-img { width: 100%; height: 210px; object-fit: cover; border-radius: 8px; }
        .rec-title { font-size: 0.9rem; text-align: center; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ddd; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <header>
        <h1>📺 New Shows Tracker</h1>
        <p>Your quick guide to the latest and most popular TV shows</p>
        
        <div class="controls-wrapper">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search for any TV show..." onkeypress="handleKeyPress(event)">
                <button onclick="performSearch()">Search</button>
            </div>
            
            <div class="dropdowns-row">
                <div class="sort-container">
                    <label for="sort-select" style="color: #aaa; font-weight: bold; margin-right: 5px;">Sort:</label>
                    <select id="sort-select" onchange="applyFilters()">
                        <option value="popularity.desc">Most Popular</option>
                        <option value="first_air_date.desc">Newest Release</option>
                        <option value="vote_average.desc">Highest Rated</option>
                    </select>
                </div>
                <div class="genre-container">
                    <label for="genre-select" style="color: #aaa; font-weight: bold; margin-right: 5px;">Genre:</label>
                    <select id="genre-select" onchange="applyFilters()">
                        <option value="">All Genres</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <div class="filters" id="filters">
        <button class="network-btn active" onclick="fetchShows('213', this, 1)">Netflix</button>
        <button class="network-btn" onclick="fetchShows('1024', this, 1)">Amazon Prime</button>
        <button class="network-btn" onclick="fetchShows('49', this, 1)">HBO</button>
        <button class="network-btn" onclick="fetchShows('2552', this, 1)">Apple TV+</button>
        <button class="network-btn" onclick="fetchShows('453', this, 1)">Hulu</button>
        <button class="network-btn" onclick="fetchShows('2739', this, 1)">Disney+</button>
        <button class="fav-filter-btn" onclick="showFavorites(this)">⭐ My Favorites</button>
        <button class="watched-filter-btn" onclick="showWatched(this)">✔️ Watched Shows</button>
    </div>

    <div class="shows-grid" id="shows-grid"></div>

    <div id="show-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modal-img" src="" alt="Poster" class="modal-poster">
            
            <div class="modal-details">
                <h2 id="modal-title">Show Title</h2>
                
                <div class="modal-meta-info">
                    <span id="modal-date">📅 Release Date: Loading...</span>
                    <span id="modal-status" class="meta-badge">Status: Loading...</span>
                    <span id="modal-seasons" class="meta-badge">Seasons: Loading...</span>
                    <span id="modal-country" class="meta-badge">🌍 Origin: Loading...</span>
                </div>
                
                <div class="ratings-box">
                    <div class="rating-item" style="color: #01b4e4;">
                        <span class="rating-label">TMDB Rating</span> 
                        <span class="rating-value">⭐ <span id="modal-tmdb-rating">...</span></span>
                        <span id="modal-tmdb-votes" class="rating-votes"></span>
                    </div>
                    <div class="rating-item" style="color: var(--imdb-color);">
                        <span class="rating-label">IMDb Rating</span> 
                        <span class="rating-value">🎬 <span id="modal-imdb-rating">...</span></span>
                        <span id="modal-imdb-votes" class="rating-votes"></span>
                    </div>
                </div>

                <h3>Overview:</h3>
                <p id="modal-overview" class="modal-overview"></p>
                
                <div class="action-buttons">
                    <a id="trailer-btn" class="trailer-btn" href="#" target="_blank" style="display: none;">▶ Watch Trailer</a>
                    <button id="favorite-btn" class="fav-btn">❤️ Add to Favorites</button>
                    <select id="watched-select" class="watched-select">
    <option value="0">➕ Track Progress</option>
</select>
                    </div> <div class="share-row">
                    <span class="share-label">Share:</span>
                    <a id="share-wa" class="share-btn share-wa" target="_blank" href="#" title="Share on WhatsApp">
                        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/></svg>
                    </a>
                    <a id="share-tw" class="share-btn share-tw" target="_blank" href="#" title="Share on X">
                        <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    </a>
                </div>          
            </div>

            <div class="recommendations-section" id="rec-section" style="display: none;">
                <h3>You Might Also Like</h3>
                <div class="rec-container" id="rec-container"></div>
            </div>
        </div>
    </div>

    <script>
        const TMDB_API_KEY = 'e7be99b2666a862f16f0a6b5441c150b'; 
        const OMDB_API_KEY = '75583472';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        
        const grid = document.getElementById('shows-grid');
        const modal = document.getElementById('show-modal');

        let currentPage = 1;
        let currentMode = 'network';
        let currentNetwork = '213';
        let currentSearchQuery = '';
        
        let isLoading = false;
        let hasMorePages = true;
        
        // التخزين المؤقت (Cache) لمنع تكرار طلبات IMDb المفرطة
        let imdbCache = JSON.parse(sessionStorage.getItem('imdbCache')) || {};

        function formatVotes(votesStr) {
            if (!votesStr || votesStr === "N/A") return "";
            const votes = parseInt(votesStr.toString().replace(/,/g, ''));
            if (isNaN(votes)) return "";
            if (votes >= 1000000) return (votes / 1000000).toFixed(1) + 'M';
            if (votes >= 1000) return (votes / 1000).toFixed(1).replace('.0', '') + 'K';
            return votes.toString();
        }

        async function fetchGenres() {
            try {
                const response = await fetch(`${BASE_URL}/genre/tv/list?api_key=${TMDB_API_KEY}&language=en-US`);
                const data = await response.json();
                const genreSelect = document.getElementById('genre-select');
                data.genres.forEach(genre => {
                    const option = document.createElement('option');
                    option.value = genre.id;
                    option.textContent = genre.name;
                    genreSelect.appendChild(option);
                });
            } catch (error) { console.error("Error loading genres", error); }
        }
        fetchGenres();

        function applyFilters() {
            if (currentMode === 'network') fetchShows(currentNetwork, document.querySelector('.filters button.active'), 1);
            else if (currentMode === 'search') performSearch(1);
            else if (currentMode === 'favorites') showFavorites(document.querySelector('.fav-filter-btn'));
            else if (currentMode === 'watched') showWatched(document.querySelector('.watched-filter-btn'));
        }

        function showSkeletons(count = 20, clearGrid = false) {
            if (clearGrid) grid.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const skeleton = document.createElement('div');
                skeleton.className = 'skeleton-card skeleton-item';
                skeleton.innerHTML = `
                    <div class="skeleton-img skeleton"></div>
                    <div class="skeleton-info">
                        <div class="skeleton-text skeleton"></div>
                        <div class="skeleton-text-small skeleton"></div>
                    </div>
                `;
                grid.appendChild(skeleton);
            }
        }

        function removeSkeletons() {
            const skeletons = document.querySelectorAll('.skeleton-item');
            skeletons.forEach(s => s.remove());
        }

        async function fetchShows(networkId, btnElement, page = 1) {
            if (isLoading) return;
            isLoading = true;
            currentMode = 'network';
            currentNetwork = networkId;
            currentPage = page;

            if (page === 1) {
                document.getElementById('search-input').value = ''; 
                hasMorePages = true;
                showSkeletons(20, true);
            } else {
                showSkeletons(8, false);
            }
            
            if (btnElement) {
                document.querySelectorAll('.filters button').forEach(btn => btn.classList.remove('active'));
                btnElement.classList.add('active');
            }

            const sortValue = document.getElementById('sort-select').value;
            const genreValue = document.getElementById('genre-select').value;
            
            let extraParams = '';
            if (sortValue === 'vote_average.desc') extraParams = '&vote_count.gte=200';
            else if (sortValue === 'first_air_date.desc') extraParams = '&vote_count.gte=5';
            if (genreValue) extraParams += `&with_genres=${genreValue}`;

            try {
                const response = await fetch(`${BASE_URL}/discover/tv?api_key=${TMDB_API_KEY}&language=en-US&sort_by=${sortValue}${extraParams}&with_networks=${networkId}&page=${page}`);
                if (!response.ok) throw new Error('Connection error.');
                const data = await response.json();
                
                removeSkeletons();
                displayShows(data.results);
                
                hasMorePages = data.page < data.total_pages;
                if (data.results.length === 0 && page === 1) grid.innerHTML = '<div class="loading-message">No shows found for this filter.</div>';
            } catch (error) {
                removeSkeletons();
                if (page === 1) grid.innerHTML = `<div class="loading-message" style="color: red;">${error.message}</div>`;
            }
            isLoading = false;
        }

        async function performSearch(page = 1) {
            if (isLoading) return;
            isLoading = true;
            currentMode = 'search';
            currentPage = page;

            if (page === 1) {
                currentSearchQuery = document.getElementById('search-input').value.trim();
                hasMorePages = true;
                showSkeletons(20, true);
                document.querySelectorAll('.filters button').forEach(btn => btn.classList.remove('active'));
            } else {
                showSkeletons(8, false);
            }

            if (!currentSearchQuery) { isLoading = false; removeSkeletons(); return; }

            try {
                const response = await fetch(`${BASE_URL}/search/tv?api_key=${TMDB_API_KEY}&language=en-US&query=${encodeURIComponent(currentSearchQuery)}&page=${page}`);
                const data = await response.json();
                
                removeSkeletons();
                if (page === 1 && data.results.length === 0) {
                    grid.innerHTML = '<div class="loading-message">No shows found. Try another name!</div>';
                    isLoading = false; return;
                }

                let sortedResults = data.results;
                const genreValue = document.getElementById('genre-select').value;
                if (genreValue) sortedResults = sortedResults.filter(show => show.genre_ids && show.genre_ids.includes(parseInt(genreValue)));

                const sortValue = document.getElementById('sort-select').value;
                if (sortValue === 'first_air_date.desc') sortedResults.sort((a, b) => new Date(b.first_air_date || 0) - new Date(a.first_air_date || 0));
                else if (sortValue === 'vote_average.desc') sortedResults.sort((a, b) => b.vote_average - a.vote_average);
                else sortedResults.sort((a, b) => b.popularity - a.popularity);

                if (sortedResults.length === 0 && page === 1) {
                    grid.innerHTML = '<div class="loading-message">No results match this genre.</div>';
                } else {
                    displayShows(sortedResults);
                }
                hasMorePages = data.page < data.total_pages;
            } catch (error) {
                removeSkeletons();
                if (page === 1) grid.innerHTML = `<div class="loading-message" style="color: red;">${error.message}</div>`;
            }
            isLoading = false;
        }

        function handleKeyPress(event) { if (event.key === 'Enter') performSearch(1); }

        function showFavorites(btnElement) {
            currentMode = 'favorites';
            document.getElementById('search-input').value = '';
            hasMorePages = false; 
            
            if (btnElement) {
                document.querySelectorAll('.filters button').forEach(btn => btn.classList.remove('active'));
                btnElement.classList.add('active');
            }

            grid.innerHTML = '';
            let favorites = JSON.parse(localStorage.getItem('my_favorite_shows')) || [];
            
            const genreValue = document.getElementById('genre-select').value;
            if (genreValue) favorites = favorites.filter(show => show.genre_ids && show.genre_ids.includes(parseInt(genreValue)));

            if (favorites.length === 0) {
                grid.innerHTML = '<div class="loading-message">No favorite shows found here. ⭐</div>';
                return;
            }

            const sortValue = document.getElementById('sort-select').value;
            if (sortValue === 'first_air_date.desc') favorites.sort((a, b) => new Date(b.first_air_date || 0) - new Date(a.first_air_date || 0));
            else if (sortValue === 'vote_average.desc') favorites.sort((a, b) => b.vote_average - a.vote_average);
            else favorites.sort((a, b) => b.popularity - a.popularity);

            displayShows(favorites);
        }

        function showWatched(btnElement) {
            currentMode = 'watched';
            document.getElementById('search-input').value = '';
            hasMorePages = false; 
            
            if (btnElement) {
                document.querySelectorAll('.filters button').forEach(btn => btn.classList.remove('active'));
                btnElement.classList.add('active');
            }

            grid.innerHTML = '';
            let watched = JSON.parse(localStorage.getItem('my_watched_shows')) || [];
            
            const genreValue = document.getElementById('genre-select').value;
            if (genreValue) watched = watched.filter(show => show.genre_ids && show.genre_ids.includes(parseInt(genreValue)));

            if (watched.length === 0) {
                grid.innerHTML = '<div class="loading-message">You haven\'t marked any shows as watched yet. ✔️</div>';
                return;
            }

            const sortValue = document.getElementById('sort-select').value;
            if (sortValue === 'first_air_date.desc') watched.sort((a, b) => new Date(b.first_air_date || 0) - new Date(a.first_air_date || 0));
            else if (sortValue === 'vote_average.desc') watched.sort((a, b) => b.vote_average - a.vote_average);
            else watched.sort((a, b) => b.popularity - a.popularity);

            displayShows(watched);
        }

        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                if (!isLoading && hasMorePages) {
                    if (currentMode === 'network') fetchShows(currentNetwork, null, currentPage + 1);
                    else if (currentMode === 'search') performSearch(currentPage + 1);
                }
            }
        });

        // جلب تقييم IMDb في الخلفية بدون تجميد الموقع
        async function fetchIMDbForCard(tmdbId) {
            const span = document.getElementById(`card-imdb-${tmdbId}`);
            if (!span) return;
            
            if (imdbCache[tmdbId]) {
                span.innerText = imdbCache[tmdbId];
                return;
            }

            try {
                const extRes = await fetch(`${BASE_URL}/tv/${tmdbId}/external_ids?api_key=${TMDB_API_KEY}`);
                const extData = await extRes.json();
                const imdbId = extData.imdb_id;
                
                if (!imdbId) {
                    imdbCache[tmdbId] = "N/A";
                    if(document.getElementById(`card-imdb-${tmdbId}`)) document.getElementById(`card-imdb-${tmdbId}`).innerText = "N/A";
                    return;
                }
                
                const omdbRes = await fetch(`https://www.omdbapi.com/?i=${imdbId}&apikey=${OMDB_API_KEY}`);
                const omdbData = await omdbRes.json();
                
                let rating = "N/A";
                if (omdbData.Response === "True" && omdbData.imdbRating && omdbData.imdbRating !== "N/A") {
                    rating = omdbData.imdbRating;
                }
                
                imdbCache[tmdbId] = rating;
                sessionStorage.setItem('imdbCache', JSON.stringify(imdbCache));
                
                if(document.getElementById(`card-imdb-${tmdbId}`)) {
                    document.getElementById(`card-imdb-${tmdbId}`).innerText = rating;
                }
            } catch (error) {
                // Ignore silent errors for cards
            }
        }

        function displayShows(showsToDisplay) {
            let watchedShows = JSON.parse(localStorage.getItem('my_watched_shows')) || [];

            showsToDisplay.forEach(show => {
                const card = document.createElement('div');
                card.className = 'show-card';
                card.id = `card-${show.id}`;
                card.onclick = () => openModal(show);
                
                const posterPath = show.poster_path ? IMG_URL + show.poster_path : 'https://via.placeholder.com/500x750?text=No+Image';
                const releaseYear = show.first_air_date ? show.first_air_date.substring(0,4) : 'N/A';
                const tmdbRating = show.vote_average ? show.vote_average.toFixed(1) : 'NR';
                
                const savedWatched = watchedShows.find(w => w.id === show.id);
                let badgeText = '';
                if (savedWatched) {
                    badgeText = savedWatched.watched_progress === 'all' ? '✔️ All' : `✔️ S${savedWatched.watched_progress}`;
                }
                const badgeHTML = savedWatched ? `<div class="watched-badge">${badgeText}</div>` : '';
                

                // إضافة التقييمات مع الشعارات في الكرت الخارجي
                card.innerHTML = `
                    ${badgeHTML}
                    <img src="${posterPath}" alt="${show.name}" class="show-image" loading="lazy">
                    <div class="show-info">
                        <h3 class="show-title">${show.name}</h3>
                        <div class="card-meta-footer">
                            <div class="rating-pill">
                                <img src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_square_1-5bdc75aaebeb75dc7ae79426ddd9be3b2be1e342510f8202baf6bffa71d7f5c4.svg" alt="TMDB" class="icon-tmdb">
                                <span>${tmdbRating}</span>
                            </div>
                            <div class="rating-pill">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/6/69/IMDB_Logo_2016.svg" alt="IMDb" class="icon-imdb">
                                <span id="card-imdb-${show.id}">${imdbCache[show.id] || '⏳'}</span>
                            </div>
                            <div class="rating-pill">📅 ${releaseYear}</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
                
                // جلب تقييم IMDb في الخلفية إذا لم يكن موجوداً في الـ Cache
                if (!imdbCache[show.id]) {
                    fetchIMDbForCard(show.id);
                }
            });
        }

        // --- دوال النافذة المنبثقة (Modal) ---
        async function fetchExternalRatings(tmdbId) {
            try {
                const extRes = await fetch(`${BASE_URL}/tv/${tmdbId}/external_ids?api_key=${TMDB_API_KEY}`);
                const extData = await extRes.json();
                const imdbId = extData.imdb_id;
                if (!imdbId) return { imdb: "N/A", votes: "" };
                
                const omdbRes = await fetch(`https://www.omdbapi.com/?i=${imdbId}&apikey=${OMDB_API_KEY}`);
                const omdbData = await omdbRes.json();
                
                if (omdbData.Response === "True" && omdbData.imdbRating && omdbData.imdbRating !== "N/A") {
                    // تحديث الـ Cache أيضاً عند الفتح
                    imdbCache[tmdbId] = omdbData.imdbRating;
                    sessionStorage.setItem('imdbCache', JSON.stringify(imdbCache));
                    return { imdb: `${omdbData.imdbRating} / 10`, votes: omdbData.imdbVotes };
                }
                return { imdb: "N/A", votes: "" };
            } catch (error) { return { imdb: "N/A", votes: "" }; }
        }

        async function openModal(show) {
            document.getElementById('modal-title').innerText = show.name;
            document.getElementById('modal-date').innerText = '📅 Release Date: ' + (show.first_air_date || 'N/A');
            document.getElementById('modal-overview').innerText = show.overview ? show.overview : 'Sorry, no overview available for this show.';
            
            document.getElementById('modal-status').innerText = 'Status: Loading...';
            document.getElementById('modal-seasons').innerText = 'Seasons: Loading...';
            // جلب رمز الدولة، تحويله لاسم كامل، ووضع صورة حقيقية للعلم
            const countryCode = (show.origin_country && show.origin_country.length > 0) ? show.origin_country[0] : null;
            if (countryCode) {
                // تحويل الرمز (AR) إلى اسم الدولة الكامل (Argentina)
                const countryName = new Intl.DisplayNames(['en'], { type: 'region' }).of(countryCode);
                // استخدام خدمة FlagCDN لجلب صورة العلم بجودة عالية
                const flagUrl = `https://flagcdn.com/20x15/${countryCode.toLowerCase()}.png`;
                document.getElementById('modal-country').innerHTML = `<img src="${flagUrl}" alt="${countryCode}" style="vertical-align: middle; border-radius: 2px; margin-right: 5px;"> ${countryName}`;
            } else {
                document.getElementById('modal-country').innerHTML = `🌍 Unknown`;
            }
            
            document.getElementById('modal-tmdb-rating').innerText = show.vote_average ? show.vote_average.toFixed(1) + ' / 10' : 'N/A';
            document.getElementById('modal-tmdb-votes').innerText = show.vote_count ? formatVotes(show.vote_count) : '';

            document.getElementById('modal-imdb-rating').innerText = imdbCache[show.id] ? imdbCache[show.id] + ' / 10' : '⏳';
            document.getElementById('modal-imdb-votes').innerText = '';

            const posterPath = show.poster_path ? IMG_URL + show.poster_path : 'https://via.placeholder.com/500x750?text=No+Image';
            document.getElementById('modal-img').src = posterPath;
            
            const trailerBtn = document.getElementById('trailer-btn');
            trailerBtn.style.display = 'none';
            // إعداد روابط المشاركة بذكاء وتضمين رابط موقعك
            const siteUrl = encodeURIComponent("https://ahmad2681a1.github.io/shows-tracker/");
            const shareText = encodeURIComponent(`📺 اكتشفت مسلسل "${show.name}" الرهيب!\n⭐ تقييمه: ${show.vote_average ? show.vote_average.toFixed(1) : 'N/A'}\nلتفاصيل أكثر قم نظرة على موقع New Shows Tracker من هنا:\n`);

            document.getElementById('share-wa').href = `https://api.whatsapp.com/send?text=${shareText}%20${siteUrl}`;
            document.getElementById('share-tw').href = `https://twitter.com/intent/tweet?text=${shareText}&url=${siteUrl}`;
            
            document.getElementById('rec-section').style.display = 'none';
            document.getElementById('rec-container').innerHTML = '';

            // --- معالجة زر المفضلة (تحديث فوري) ---
            let favorites = JSON.parse(localStorage.getItem('my_favorite_shows')) || [];
            let favBtn = document.getElementById('favorite-btn');
            let newFavBtn = favBtn.cloneNode(true);
            favBtn.parentNode.replaceChild(newFavBtn, favBtn);
            
            const isFav = favorites.some(f => f.id === show.id);
            newFavBtn.innerHTML = isFav ? '❌ Remove Favorite' : '❤️ Add to Favorites';
            
            newFavBtn.onclick = (e) => {
                e.preventDefault();
                favorites = JSON.parse(localStorage.getItem('my_favorite_shows')) || [];
                const index = favorites.findIndex(f => f.id === show.id);
                
                if (index !== -1) {
                    favorites.splice(index, 1);
                    newFavBtn.innerHTML = '❤️ Add to Favorites';
                    // إخفاء الكرت فوراً وبسلاسة إذا كنا داخل صفحة المفضلة
                    const card = document.getElementById(`card-${show.id}`);
                    if (currentMode === 'favorites' && card) card.style.display = 'none';
                } else {
                    favorites.push(show);
                    newFavBtn.innerHTML = '❌ Remove Favorite';
                }
                localStorage.setItem('my_favorite_shows', JSON.stringify(favorites));
            };

            // --- إعداد قائمة "التقدم في المشاهدة" ---
            let watched = JSON.parse(localStorage.getItem('my_watched_shows')) || [];
            let watchSelect = document.getElementById('watched-select');
            let newWatchSelect = watchSelect.cloneNode(true);
            watchSelect.parentNode.replaceChild(newWatchSelect, watchSelect);
            
            // وضع خيارات مبدئية
            newWatchSelect.innerHTML = `<option value="0">➕ Track Progress</option><option value="all">✔️ Completed</option>`;
            
            // دالة الحفظ والتحديث الفوري عند تغيير القائمة
            newWatchSelect.onchange = (e) => {
                let currentWatched = JSON.parse(localStorage.getItem('my_watched_shows')) || [];
                const index = currentWatched.findIndex(w => w.id === show.id);
                const val = e.target.value;

                if (val === "0") {
                    if (index !== -1) currentWatched.splice(index, 1);
                } else {
                    show.watched_progress = val; // حفظ رقم الموسم
                    if (index !== -1) currentWatched[index] = show;
                    else currentWatched.push(show);
                }
                localStorage.setItem('my_watched_shows', JSON.stringify(currentWatched));
                
                // تحديث الشارة الخضراء على البوستر فوراً
                const card = document.getElementById(`card-${show.id}`);
                if (card) {
                    let badge = card.querySelector('.watched-badge');
                    if (val === "0") {
                        if (badge) badge.remove();
                        if (currentMode === 'watched') card.style.display = 'none';
                    } else {
                        let badgeText = val === 'all' ? '✔️ All' : `✔️ S${val}`;
                        if (!badge) {
                            badge = document.createElement('div');
                            badge.className = 'watched-badge';
                            card.insertBefore(badge, card.firstChild);
                        }
                        badge.innerText = badgeText;
                    }
                }
            };
            document.querySelector('.modal-content').scrollTop = 0;

            fetch(`${BASE_URL}/tv/${show.id}?api_key=${TMDB_API_KEY}&language=en-US`)
                .then(res => res.json())
                .then(details => {
                    document.getElementById('modal-status').innerText = 'Status: ' + (details.status || 'Unknown');
                    document.getElementById('modal-seasons').innerText = 'Seasons: ' + (details.number_of_seasons || 'N/A');
                    // توليد خيارات المواسم ديناميكياً بناءً على العدد الحقيقي
                    const seasonsCount = details.number_of_seasons || 1;
                    let optionsHTML = `<option value="0">➕ Not Watched</option>`;
                    for (let i = 1; i <= seasonsCount; i++) {
                        optionsHTML += `<option value="${i}">✔️ Watched Season ${i}</option>`;
                    }
                    if (seasonsCount > 1) {
                        optionsHTML += `<option value="all">✔️ Completed (${seasonsCount} Seasons)</option>`;
                    }
                    newWatchSelect.innerHTML = optionsHTML;
                    
                    // استرجاع أين توقف المستخدم وعرضه
                    const reCheckWatched = JSON.parse(localStorage.getItem('my_watched_shows')) || [];
                    const reCheckShow = reCheckWatched.find(w => w.id === show.id);
                    newWatchSelect.value = (reCheckShow && reCheckShow.watched_progress) ? reCheckShow.watched_progress : "0";
                })
                .catch(() => {
                    document.getElementById('modal-status').innerText = 'Status: N/A';
                    document.getElementById('modal-seasons').innerText = 'Seasons: N/A';
                });

            fetchExternalRatings(show.id).then(ratings => {
                document.getElementById('modal-imdb-rating').innerText = ratings.imdb;
                document.getElementById('modal-imdb-votes').innerText = ratings.votes ? formatVotes(ratings.votes) : '';
                // تحديث الكرت الخارجي أيضاً إذا كان مرئياً
                const cardImdbSpan = document.getElementById(`card-imdb-${show.id}`);
                if(cardImdbSpan) cardImdbSpan.innerText = imdbCache[show.id];
            });
            
            fetch(`${BASE_URL}/tv/${show.id}/videos?api_key=${TMDB_API_KEY}`) 
                .then(res => res.json())
                .then(data => {
                    if (data.results && data.results.length > 0) {
                        let trailer = data.results.find(vid => vid.site === 'YouTube' && vid.type === 'Trailer') || 
                                      data.results.find(vid => vid.site === 'YouTube' && vid.type === 'Teaser') || 
                                      data.results.find(vid => vid.site === 'YouTube');
                        if (trailer) {
                            trailerBtn.href = `https://www.youtube.com/watch?v=${trailer.key}`;
                            trailerBtn.style.display = 'inline-flex';
                        }
                    }
                })
                .catch(err => console.log("Trailer error:", err));
                
            fetch(`${BASE_URL}/tv/${show.id}/recommendations?api_key=${TMDB_API_KEY}&language=en-US`)
                .then(res => res.json())
                .then(data => {
                    if (data.results && data.results.length > 0) {
                        const recContainer = document.getElementById('rec-container');
                        recContainer.innerHTML = '';
                        data.results.slice(0, 10).forEach(recShow => {
                            if (!recShow.poster_path) return;
                            const recCard = document.createElement('div');
                            recCard.className = 'rec-card';
                            recCard.onclick = () => openModal(recShow);
                            recCard.innerHTML = `
                                <img class="rec-img" src="${IMG_URL + recShow.poster_path}" alt="${recShow.name}" loading="lazy">
                                <div class="rec-title">${recShow.name}</div>
                            `;
                            recContainer.appendChild(recCard);
                        });
                        if (recContainer.innerHTML !== '') document.getElementById('rec-section').style.display = 'block';
                    }
                })
                .catch(err => console.log("Recs error:", err));
        }

        function closeModal() { modal.style.display = 'none'; }
        window.onclick = function(event) { if (event.target == modal) closeModal(); }

        fetchShows('213', document.querySelector('.filters button.active'), 1);
    </script>
